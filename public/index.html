<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proof from past work</title>
  <meta name="description" content="Turn one piece of past, non-UX work into proof an employer can judge, in your own words.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@1,7..72,400;1,7..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <span class="mark" aria-hidden="true"></span>
    <span class="brand">Proof from past work</span>
  </header>

  <main id="main" tabindex="-1">
    <div id="progress" class="progress" hidden>
      <p id="progress-label" class="progress-label"></p>
      <ol class="progress-bar" aria-hidden="true"><li></li><li></li><li></li></ol>
    </div>
    <div id="screen" aria-live="polite"></div>
  </main>

  <footer class="foot">
    <p>Free to use. Nothing is saved: copy or download your proof before you leave.</p>
  </footer>

  <noscript><p class="wrap">This tool needs JavaScript turned on.</p></noscript>
  <script src="/app.js" type="module"></script>
</body>
</html>
