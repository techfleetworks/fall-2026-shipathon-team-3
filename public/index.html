<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proof from past work</title>
  <meta name="description" content="Turn one piece of past, non-UX work into proof an employer can judge, in your own words.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600,0,1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="top-left">
      <span class="logo-tile" aria-hidden="true">P</span>
      <span class="brand">Proof from past work</span>
    </div>
    <div class="top-right">
      <button id="home-btn" type="button" class="quiet sm">Home</button>
      <span class="tagline">Nothing invented</span>
    </div>
  </header>

  <nav id="progress" class="progress" aria-label="Progress" hidden>
    <ol id="progress-steps" class="progress-steps"></ol>
    <p id="progress-label" class="progress-label"></p>
  </nav>

  <main id="main" tabindex="-1">
    <div id="screen" aria-live="polite"></div>
  </main>

  <footer class="foot">
    <p>Free. No sign-up needed. Nothing is saved: copy or download your proof before you leave.</p>
  </footer>

  <noscript><p class="wrap">This tool needs JavaScript turned on.</p></noscript>
  <script src="/app.js" type="module"></script>
</body>
</html>
